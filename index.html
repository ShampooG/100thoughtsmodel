<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 Mental Models - 思维模型库</title>
    <meta name="description" content="100个顶级思维模型，助你提升认知与决策能力。">
    <meta name="theme-color" content="#f8fafc">
    <meta property="og:title" content="100 Mental Models">
    <meta property="og:description" content="100个顶级思维模型，助你提升认知与决策能力。">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=2.0">
</head>
<body>
    <div id="app">
        <aside id="sidebar">
            <div class="logo-area">
                <h2>思维模型库</h2>
                <p>100 Mental Models</p>
            </div>
            <ul id="category-list"></ul>
        </aside>
        
        <main id="main-content">
            <div id="search-container">
                <input type="text" id="search-input" placeholder="搜索思维模型...">
            </div>
            
            <div id="overview-section">
                <div class="overview-header">
                    <h1>欢迎来到思维模型库</h1>
                    <p>探索100个顶级思维模型，重塑你的认知模式</p>
                </div>
                <div id="overview-grid" class="overview-grid"></div>
            </div>

            <header id="category-header" style="display: none;">
                <h1 id="category-title"></h1>
            </header>
            
            <div id="models-grid" class="grid" style="display: none;"></div>
        </main>
    </div>

    <div id="model-modal" class="modal">
        <div class="modal-content">
            <button class="close-button" id="close-modal">&times;</button>
            <div class="modal-header">
                <h2 id="modal-title"></h2>
                <div class="modal-purpose" id="modal-summary"></div>
            </div>
            <div id="modal-detail" class="modal-detail-container"></div>
            <div class="modal-nav">
                <button id="prev-model" class="nav-btn" aria-label="上一个思维模型">
                    <span class="arrow">←</span>
                    <span class="nav-text">上一个</span>
                </button>
                <span id="modal-counter"></span>
                <button id="next-model" class="nav-btn" aria-label="下一个思维模型">
                    <span class="nav-text">下一个</span>
                    <span class="arrow">→</span>
                </button>
            </div>
        </div>
    </div>

    <button id="back-to-top" aria-label="返回顶部">↑</button>

    <script src="data.js?v=2.0"></script>
    <script src="script.js?v=2.0"></script>
</body>
</html>
